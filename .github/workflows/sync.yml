name: Gitee <-> GitHub 双向同步

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitee-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 检查令牌
        env:
          PAT: ${{ secrets.GITEE_SYNC_PAT }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${PAT:-}" ]; then
            echo "::error::缺少 GITEE_SYNC_PAT 密文（GitHub 令牌，需要勾选 repo）"
            exit 1
          fi
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::error::缺少 GITEE_TOKEN 密文（Gitee 私人令牌，需要勾选 projects）"
            exit 1
          fi

      - name: 双向同步全部仓库
        env:
          PAT: ${{ secrets.GITEE_SYNC_PAT }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: bash sync.sh

      - name: 保持定时任务不被休眠（每月一次）
        env:
          PAT: ${{ secrets.GITEE_SYNC_PAT }}
        run: |
          last=$(git log -1 --format=%ct -- heartbeat.txt 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ "$last" != "0" ] && [ $((now - last)) -lt 2592000 ]; then
            echo "本月已经续期过，跳过"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "chore: 定时任务续期"
          git push "https://x-access-token:${PAT}@github.com/YNXC-ljw/gitee-mirror.git" HEAD:main
