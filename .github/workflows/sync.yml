name: Gitee 同步到 GitHub

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitee-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查访问令牌
        env:
          PAT: ${{ secrets.GITEE_SYNC_PAT }}
        run: |
          if [ -z "${PAT:-}" ]; then
            echo "::error::缺少 GITEE_SYNC_PAT 密文。请在仓库 Settings -> Secrets and variables -> Actions 里添加名为 GITEE_SYNC_PAT 的密文（值是一个勾选了 repo 权限的 GitHub 令牌）。"
            exit 1
          fi

      - name: 同步全部仓库
        env:
          PAT: ${{ secrets.GITEE_SYNC_PAT }}
        run: |
          set -uo pipefail
          total=0
          ok=0
          failed=""
          while IFS="|" read -r gitee_slug github_name; do
            gitee_slug="$(printf %s "$gitee_slug" | tr -d "\r")"
            github_name="$(printf %s "$github_name" | tr -d "\r")"
            [ -z "$gitee_slug" ] && continue
            total=$((total + 1))
            echo "::group::$gitee_slug -> $github_name"
            rm -rf repo.git
            if ! git clone --mirror "https://gitee.com/pengge-student-c-language/${gitee_slug}.git" repo.git; then
              echo "::error::$gitee_slug 从 Gitee 拉取失败"
              failed="$failed $gitee_slug"
              echo "::endgroup::"
              continue
            fi
            if git -C repo.git push --mirror "https://x-access-token:${PAT}@github.com/YNXC-ljw/${github_name}.git"; then
              ok=$((ok + 1))
              echo "OK $gitee_slug 同步成功"
            else
              echo "::error::$gitee_slug 推送到 GitHub 失败"
              failed="$failed $gitee_slug"
            fi
            echo "::endgroup::"
          done < repos.txt
          rm -rf repo.git
          echo "共 $total 个仓库，成功 $ok 个。"
          if [ -n "$failed" ]; then
            echo "::error::以下仓库同步失败:$failed"
            exit 1
          fi
