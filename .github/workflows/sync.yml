name: Gitee <-> GitHub 双向同步

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: gitee-sync
  cancel-in-progress: false

jobs:
  sync:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 检查并验证两个令牌
        env:
          PAT: ${{ secrets.GITEE_SYNC_PAT }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set +e
          fail() { echo "::error::$1"; exit 1; }
          [ -n "${PAT:-}" ] || fail "缺少 GITEE_SYNC_PAT 密文（GitHub 令牌，需要勾选 repo）"
          [ -n "${GITEE_TOKEN:-}" ] || fail "缺少 GITEE_TOKEN 密文（Gitee 私人令牌，需要勾选 projects）"

          probe() {
            local out="$1"; shift
            local code=""
            local i
            for i in 1 2 3 4; do
              code=$(curl -sS -o "$out" -w '%{http_code}' --max-time 40 --connect-timeout 15 \
                     --retry 2 --retry-all-errors -H 'User-Agent: codex-sync' "$@" 2>/dev/null)
              if [ "$code" = "200" ]; then
                echo "$code"; return 0
              fi
              echo "::notice::第 ${i} 次探测没成功（HTTP ${code:-000}），稍后重试" >&2
              sleep 6
            done
            echo "${code:-000}"
            return 0
          }

          echo "::notice::开始校验 GitHub 令牌"
          gh_code=$(probe /tmp/gh.json -H "Authorization: Bearer ${PAT}" https://api.github.com/user)
          echo "::notice::GitHub 令牌探测结果 HTTP=${gh_code}"
          if [ "$gh_code" != "200" ]; then
            fail "GitHub 令牌校验没通过（HTTP ${gh_code}）。如果不是 200，多半是 GitHub 令牌过期或被删了，请重新生成后更新密文 GITEE_SYNC_PAT。"
          fi
          echo "GitHub 令牌有效。"

          hdr=$(curl -sS -D - -o /dev/null --max-time 40 --connect-timeout 15 -H 'User-Agent: codex-sync' \
                -H "Authorization: Bearer ${PAT}" https://api.github.com/user 2>/dev/null \
                | tr -d '\r' | awk -F': ' 'tolower($1)=="github-authentication-token-expiration"{print $2}')
          if [ -n "$hdr" ]; then
            echo "::notice::GitHub 令牌到期时间 ${hdr}"
            exp_s=$(date -d "$hdr" +%s 2>/dev/null || echo 0)
            now_s=$(date +%s)
            if [ "$exp_s" != "0" ] && [ $((exp_s - now_s)) -lt 604800 ]; then
              echo "::warning::GitHub 令牌还有不到 7 天就到期了（${hdr}），请尽快重新生成并更新密文 GITEE_SYNC_PAT。"
            fi
          fi

          echo "::notice::开始校验 Gitee 令牌"
          gt_code=$(probe /tmp/gt.json "https://gitee.com/api/v5/user?access_token=${GITEE_TOKEN}")
          echo "::notice::Gitee 令牌探测结果 HTTP=${gt_code}"
          if [ "$gt_code" != "200" ]; then
            fail "Gitee 令牌校验没通过（HTTP ${gt_code}）。如果不是 200，多半是 Gitee 令牌过期或被删了，请重新生成后更新密文 GITEE_TOKEN。"
          fi
          echo "Gitee 令牌有效。"

      - name: 双向同步全部仓库
        env:
          PAT: ${{ secrets.GITEE_SYNC_PAT }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: bash sync.sh

      - name: 保持定时任务不被休眠（每月一次）
        env:
          PAT: ${{ secrets.GITEE_SYNC_PAT }}
        run: |
          last=$(git log -1 --format=%ct -- heartbeat.txt 2>/dev/null || echo 0)
          now=$(date +%s)
          if [ "$last" != "0" ] && [ $((now - last)) -lt 2592000 ]; then
            echo "本月已经续期过，跳过"
            exit 0
          fi
          date -u +"%Y-%m-%dT%H:%M:%SZ" > heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git commit -m "chore: 定时任务续期"
          git push "https://x-access-token:${PAT}@github.com/YNXC-ljw/gitee-mirror.git" HEAD:main

      - name: 同步失败时开一个提醒 Issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          link="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="自动同步任务**失败了**，需要处理。

          - 运行记录：$link
          - 时间：$(date -u +'%Y-%m-%d %H:%M UTC')

          最常见原因：Gitee 私人令牌或 GitHub 令牌失效（过期或被删）。上面「检查并验证两个令牌」那一步会直接指出是哪个令牌的问题。"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '同步失败 in:title' --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "⚠️ Gitee 自动同步失败，需要处理" --body "$body"
          fi

      - name: 同步恢复正常时自动关闭提醒
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '同步失败 in:title' --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "本轮同步已经成功，自动关闭。"
          done
